name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          advanced-security: false
          annotations: true
          version: v1.24.1

  # Code quality checks
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test event serialization
        run: cargo test -p notify --test serialise-events --features serde --locked

      - name: Test notify 6 serialization compatibility
        run: cargo test -p notify --test serialise-events --features serde,serialization-compat-6 --locked

      - name: Install typos-cli
        uses: taiki-e/install-action@51cd0b8c0499559d9a4d75c0f5c67bec3a894ec8 # v2.75.28
        with:
          tool: typos-cli

      - name: Check for typos
        run: typos

      - name: Install cargo-deny
        uses: taiki-e/install-action@51cd0b8c0499559d9a4d75c0f5c67bec3a894ec8 # v2.75.28
        with:
          tool: cargo-deny

      - name: Run cargo-deny
        run: cargo deny check

      - name: Install cargo-machete
        uses: taiki-e/install-action@51cd0b8c0499559d9a4d75c0f5c67bec3a894ec8 # v2.75.28
        with:
          tool: cargo-machete

      - name: Run cargo-machete
        run: cargo machete

  # Test on multiple platforms with different Rust versions
  test:
    name: Test ${{ matrix.os }} - ${{ matrix.rust }} ${{ matrix.features != '' && format('({0})', matrix.features) || '' }}
    runs-on: ${{ matrix.os }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: [stable, nightly, 1.88]
        include:
          # MacOS with fsevent
          - os: macos-latest
            rust: stable
            features: "--no-default-features --features macos_fsevent"
          - os: macos-latest
            rust: nightly
            features: "--no-default-features --features macos_fsevent"
          - os: macos-latest
            rust: 1.88
            features: "--no-default-features --features macos_fsevent"
          # MacOS with kqueue
          - os: macos-latest
            rust: stable
            features: "--no-default-features --features macos_kqueue"
          - os: macos-latest
            rust: nightly
            features: "--no-default-features --features macos_kqueue"
          - os: macos-latest
            rust: 1.88
            features: "--no-default-features --features macos_kqueue"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Remove rust-toolchain.toml (Unix)
        if: runner.os != 'Windows'
        run: rm -f rust-toolchain.toml

      - name: Remove rust-toolchain.toml (Windows)
        if: runner.os == 'Windows'
        run: |
          if (Test-Path rust-toolchain.toml) {
            Remove-Item -Path rust-toolchain.toml
          }

      - name: Install Rust ${{ matrix.rust }}
        run: |
          rustup override set ${{ matrix.rust }}
          rustup update ${{ matrix.rust }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --verbose ${{ matrix.features }}

      - name: Build examples
        run: cargo build --examples --verbose ${{ matrix.features }}

      - name: Run tests
        run: cargo test --workspace --exclude examples --verbose ${{ matrix.features }}

      - name: Test kqueue file descriptor limit
        if: runner.os == 'macOS' && matrix.rust == 'stable' && contains(matrix.features, 'macos_kqueue')
        run: cargo test -p notify --lib --no-default-features --features macos_kqueue kqueue::tests::fd_limit_stops_watches -- --ignored --exact --test-threads=1
        
      - name: Run tests with futures
        if: matrix.rust == 'stable'
        run: cargo test --workspace --exclude examples --verbose ${{ matrix.features }} --features futures

      - name: Run tests with tokio
        if: matrix.rust == 'stable'
        run: cargo test --workspace --exclude examples --verbose ${{ matrix.features }} --features tokio

  # Verify automatic backend selection: kqueue before 14.5, inotify on 14.5+.
  freebsd:
    name: FreeBSD ${{ matrix.release }} (${{ matrix.backend }}) - ${{ matrix.rust }}
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, nightly, 1.88]
        backend: [kqueue, inotify]
        include:
          - backend: kqueue
            release: "14.4"
          - backend: inotify
            release: "15.1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Test in FreeBSD VM
        uses: vmactions/freebsd-vm@b84ab5559b5a1bb4b8ee2737d2506a16e1737636 # v1.4.8
        with:
          release: ${{ matrix.release }}
          envs: "CARGO_TERM_COLOR RUST_BACKTRACE"
          usesh: true
          prepare: |
            pkg install -y curl
          run: |
            rm -f rust-toolchain.toml
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile=minimal --default-toolchain ${{ matrix.rust }}
            . $HOME/.cargo/env
            cargo --version
            rustc --version
            cargo build --verbose
            cargo build --examples --verbose
            cargo test --verbose
            if [ "${{ matrix.backend }}" = "kqueue" ] && [ "${{ matrix.rust }}" = "stable" ]; then
              cargo test -p notify --lib kqueue::tests::fd_limit_stops_watches -- --ignored --exact --test-threads=1
            fi

  # Android cross-compilation
  android:
    name: Android
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Remove rust-toolchain.toml
        run: rm -f rust-toolchain.toml

      - name: Install Rust
        run: |
          rustup override set stable
          rustup update stable
          rustup target add armv7-linux-androideabi aarch64-linux-android

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-ndk
        uses: taiki-e/install-action@51cd0b8c0499559d9a4d75c0f5c67bec3a894ec8 # v2.75.28
        with:
          tool: cargo-ndk

      - name: Build for Android (arm64)
        run: cargo ndk --target aarch64-linux-android build --verbose

      - name: Build for Android (arm)
        run: cargo ndk --target armv7-linux-androideabi build --verbose

  # WebAssembly and WebAssembly System Interface (WASI)
  wasm:
    name: WebAssembly ${{ matrix.target }} - ${{ matrix.rust }}
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-unknown-unknown, wasm32-wasip1, wasm32-wasip2]
        rust: [stable, 1.88]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust ${{ matrix.rust }}
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal
          rustup target add --toolchain ${{ matrix.rust }} ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm-${{ matrix.rust }}-${{ matrix.target }}

      # The file-id CLI requires Unix or Windows; its types also support wasm.
      - name: Build libraries and examples
        run: cargo +${{ matrix.rust }} build --workspace --lib --examples --target ${{ matrix.target }} --verbose --locked

      - name: Build libraries and examples with all features
        run: cargo +${{ matrix.rust }} build --workspace --lib --examples --all-features --target ${{ matrix.target }} --verbose --locked

      - name: Compile unit tests
        run: cargo +${{ matrix.rust }} test --workspace --exclude examples --lib --no-run --target ${{ matrix.target }} --verbose --locked

      - name: Compile unit tests with all features
        run: cargo +${{ matrix.rust }} test --workspace --exclude examples --lib --no-run --all-features --target ${{ matrix.target }} --verbose --locked

      - name: Install Wasmtime
        if: matrix.target != 'wasm32-unknown-unknown'
        uses: taiki-e/install-action@51cd0b8c0499559d9a4d75c0f5c67bec3a894ec8 # v2.75.28
        with:
          tool: wasmtime@49.0.3

      # Watchers spawn threads, which these WASI targets do not support.
      - name: Run portable tests on WASI
        if: matrix.target != 'wasm32-unknown-unknown'
        env:
          INSTA_WORKSPACE_ROOT: ${{ github.workspace }}
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime --dir . --dir ${{ github.workspace }} --env INSTA_WORKSPACE_ROOT
          CARGO_TARGET_WASM32_WASIP2_RUNNER: wasmtime --dir . --dir ${{ github.workspace }} --env INSTA_WORKSPACE_ROOT
        run: |
          cargo +${{ matrix.rust }} test -p notify-types --lib --features serde --target ${{ matrix.target }} --locked -- --test-threads=1
          cargo +${{ matrix.rust }} test -p notify-types --lib --all-features --target ${{ matrix.target }} --locked -- --test-threads=1
          cargo +${{ matrix.rust }} test -p notify --lib --target ${{ matrix.target }} --locked -- config:: error:: paths:: --test-threads=1
          cargo +${{ matrix.rust }} test -p notify-debouncer-full --lib --all-features --target ${{ matrix.target }} --locked -- tests::state tests::sort_events_ties_by_path tests::recursive_mode_uses_recursive_root_for_overlapping_watches --test-threads=1
